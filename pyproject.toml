[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toopowerful"
version = "0.1.0"
description = "Zero-dependency Python HTTP client — sync + async, retries, cache, middleware, auth, parallel, streaming."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Peter" }]
keywords = ["http", "requests", "httpx", "client", "async", "retry", "cache", "auth"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/peter-research/TooPowerful"
Repository = "https://github.com/peter-research/TooPowerful"
Issues = "https://github.com/peter-research/TooPowerful/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/toopowerful"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
